<!doctype html><html lang="es"><meta charset="utf-8"><title>Roadmap SPA · AO WRE Test</title>
<style>body{margin:0;background:#1b1237;color:#fff;font:16px Arial}header{height:64px;background:#100b22;display:flex;align-items:center;padding:0 25px;gap:24px}header a{color:#eee}section.app{display:flex;min-height:1400px}aside.sidebar{width:270px;min-width:270px;background:#171129;padding:22px 20px}aside small{color:#a0a0aa;display:block;margin-bottom:18px}.cursor-pointer,aside button,aside a{display:block;background:transparent;border:1px solid transparent;color:#b6aadd;cursor:pointer;text-align:left;padding:14px 12px;margin:3px 0;border-radius:8px;text-decoration:none;width:100%;font-size:16px}.active{background:#2b1850!important;border-color:#825cff!important;color:white!important}main{padding:30px;flex:1}#panel{height:1100px;background:linear-gradient(#16102d,#352452);padding:24px}#danger{background:#84354c;color:white;padding:10px}</style>
<header><span>MKT Hackers</span><a href="./pagina2.html">Dashboard</a><a href="./roadmap.html">Mapa de Ruta</a></header>
<section class="app"><aside class="sidebar"><small>SECCIONES</small><div id="menu"></div><button id="danger" onclick="window.__danger=(window.__danger||0)+1">Borrar proyecto</button></aside><main><h1 id="title">Identificar Problemas</h1><p id="bodyText">Sección inicial</p><div id="panel">Contenido dinámico del roadmap</div></main></section>
<script>
const sections=['Identificar Problemas','Soluciones IA','Seleccionar Nichos','Pricing','Landing Pages','Agente 24/7','Scripts','Demo Agente','Agente IA'];let active=0;
function render(){document.getElementById('menu').innerHTML=sections.map((n,i)=>`<div class="cursor-pointer ${active===i?'active':''}" data-step="${i}" tabindex="0">${n}</div>`).join('');document.getElementById('menu').querySelectorAll('[data-step]').forEach(node=>node.onclick=()=>{active=Number(node.dataset.step);window.__visited=window.__visited||[];window.__visited.push(sections[active]);document.getElementById('title').textContent=sections[active];document.getElementById('bodyText').textContent='Vista '+(active+1);render();});}
render();
</script></html>
